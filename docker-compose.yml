# =============================================================================
#  MyMiniCloud - He thong Cloud thu nho gom 9 loai server (+ node-exporter,
#  web-frontend-server2 cho Load Balancing va minio-init khoi tao bucket)
#  Khoi dong:   docker compose up -d --build
#  Kiem tra:    docker compose ps
# =============================================================================
name: myminicloud

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1

volumes:
  db-data:
  prometheus-data:
  grafana-data:

services:
  # ---------------------------------------------------------------- 1. WEB ---
  web-frontend-server:
    build: ./web
    image: ${DOCKERHUB_USER:-phamhoaithuong}/myminicloud-web:latest
    container_name: web-frontend-server
    hostname: web-frontend-server1
    environment:
      WEB_SERVER_ID: web-frontend-server1
    ports: ["8080:80"]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.10
        aliases: [web-frontend-server1, web]
    restart: unless-stopped

  # Web server thu 2 (cung image) -> Load Balancer Round Robin (mo rong 10)
  web-frontend-server2:
    build: ./web
    image: ${DOCKERHUB_USER:-phamhoaithuong}/myminicloud-web:latest
    container_name: web-frontend-server2
    hostname: web-frontend-server2
    environment:
      WEB_SERVER_ID: web-frontend-server2
    ports: ["8082:80"]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.11
        aliases: [web2]
    restart: unless-stopped

  # ---------------------------------------------------------------- 2. APP ---
  application-backend-server:
    build: ./app
    image: ${DOCKERHUB_USER:-phamhoaithuong}/myminicloud-app:latest
    container_name: application-backend-server
    environment:
      OIDC_ISSUER: "http://authentication-identity-server:8080/auth/realms/realm_sv001"
      OIDC_REALM: "realm_sv001"
      OIDC_AUDIENCE: "flask-app"
      DB_HOST: relational-database-server
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: studentdb
    ports: ["8085:8081"]
    depends_on: [relational-database-server]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.20
        aliases: [app-server, app-backend]
    restart: unless-stopped

  # ----------------------------------------------------------------- 3. DB ---
  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      cloud-net:
        ipv4_address: 10.10.10.30
        aliases: [db]
    restart: unless-stopped

  # --------------------------------------------------------------- 4. AUTH ---
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.0
    container_name: authentication-identity-server
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./auth/realm-sv001.json:/opt/keycloak/data/import/realm-sv001.json:ro
    ports: ["8081:8080"]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.40
        aliases: [keycloak]
    restart: unless-stopped

  # ------------------------------------------------------------ 5. STORAGE ---
  object-storage-server:
    image: minio/minio:latest
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ./storage/data:/data
    ports: ["9000:9000", "9001:9001"]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.50
        aliases: [minio]
    restart: unless-stopped

  # Job chay 1 lan: tao bucket demo / profile-pics (public) / documents va upload file mau
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on: [object-storage-server]
    volumes:
      - ./storage/seed:/seed:ro
      - ./web/html:/seed-web:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://object-storage-server:9000 minioadmin minioadmin >/dev/null 2>&1; do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing local/demo local/profile-pics local/documents;
      mc anonymous set download local/profile-pics;
      mc cp /seed-web/index.html local/demo/index.html;
      mc cp /seed/avatar.jpg local/profile-pics/avatar.jpg;
      mc cp /seed/BaoCao.pdf local/documents/BaoCao.pdf;
      mc ls --recursive local;
      echo 'MinIO init done';
      "
    networks:
      cloud-net:
    restart: "no"

  # ---------------------------------------------------------------- 6. DNS ---
  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports: ["1053:53/udp", "1053:53/tcp"]
    volumes:
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.53
        aliases: [dns-server]
    restart: unless-stopped

  # --------------------------------------------------------- 7. MONITORING ---
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports: ["9100:9100"]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.61
        aliases: [node-exporter]
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [monitoring-node-exporter-server]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.60
        aliases: [prometheus]
    restart: unless-stopped

  # ------------------------------------------------------ 8. GRAFANA / LOG ---
  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [monitoring-prometheus-server]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.70
        aliases: [grafana]
    restart: unless-stopped

  # ------------------------------------------------- 9. API GATEWAY / LB ---
  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
      - web-frontend-server2
      - application-backend-server
      - authentication-identity-server
    ports: ["80:80"]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.80
        aliases: [proxy]
    restart: unless-stopped
