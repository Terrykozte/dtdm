# API Gateway / Reverse Proxy / Load Balancer - diem vao duy nhat cua MyMiniCloud
events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  charset       utf-8;

  # Log co them upstream da xu ly request -> de quan sat Round Robin
  log_format gateway '$remote_addr - [$time_local] "$request" $status '
                     'upstream=$upstream_addr rt=$request_time';
  access_log /var/log/nginx/access.log gateway;

  # Buffer lon cho cookie/header cua Keycloak admin console
  proxy_buffer_size        128k;
  proxy_buffers            4 256k;
  proxy_busy_buffers_size  256k;

  # Mo rong 10: Load Balancing 2 web server - thuat toan mac dinh Round Robin
  upstream web_backend {
    server web-frontend-server1:80;   # alias cua container web-frontend-server
    server web-frontend-server2:80;
  }

  upstream app_backend {
    server application-backend-server:8081;
  }

  server {
    listen 80;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Web tinh (can bang tai qua 2 web server)
    location / {
      proxy_pass http://web_backend;
      add_header X-Upstream $upstream_addr always;
    }

    # App API (strip /api/)  ->  /api/hello  =>  backend /hello
    location /api/ {
      proxy_pass http://app_backend/;
    }

    # Mo rong 9: route /student/ -> API /student cua backend
    location = /student {
      return 301 /student/;
    }
    location /student/ {
      proxy_pass http://app_backend/student;
    }

    # VeganGlow eCommerce Storefront
    location /shop/ {
      proxy_pass http://veganglow-web:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak (KC_HTTP_RELATIVE_PATH=/auth nen giu nguyen tien to /auth/)
    location /auth/ {
      proxy_pass http://authentication-identity-server:8080/auth/;
    }

    # Health check cua chinh gateway
    location = /gateway-health {
      default_type application/json;
      return 200 '{"status":"ok","service":"api-gateway-proxy-server"}';
    }
  }
}
