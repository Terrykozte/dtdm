<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Đám mây và mạng lưới nút máy chủ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b3e"/>
      <stop offset="0.55" stop-color="#1c1f5a"/>
      <stop offset="1" stop-color="#3b1e6e"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b3e5fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e1f5fe"/>
      <stop offset="0.5" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#1565c0"/>
    </radialGradient>
    <radialGradient id="node2" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ede7f6"/>
      <stop offset="0.5" stop-color="#b388ff"/>
      <stop offset="1" stop-color="#5e35b1"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="60" cy="40" r="1.5"/><circle cx="150" cy="90" r="1"/><circle cx="260" cy="30" r="1.4"/>
    <circle cx="420" cy="60" r="1"/><circle cx="560" cy="25" r="1.6"/><circle cx="700" cy="70" r="1.2"/>
    <circle cx="760" cy="160" r="1"/><circle cx="40" cy="200" r="1.2"/><circle cx="720" cy="400" r="1.4"/>
    <circle cx="90" cy="410" r="1"/><circle cx="380" cy="420" r="1.2"/>
  </g>
  <circle cx="400" cy="190" r="200" fill="url(#glow)"/>
  <g stroke="url(#line)" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M400 230 L150 340"/><path d="M400 230 L270 380"/><path d="M400 230 L400 395"/>
    <path d="M400 230 L530 380"/><path d="M400 230 L650 340"/><path d="M400 230 L110 230"/>
    <path d="M400 230 L690 230"/><path d="M150 340 L270 380"/><path d="M530 380 L650 340"/>
    <path d="M110 230 L150 340"/><path d="M690 230 L650 340"/><path d="M270 380 L400 395 L530 380"/>
  </g>
  <g fill="url(#cloud)">
    <path d="M250 230 C215 230 200 200 222 180 C212 145 255 125 285 145 C300 100 365 85 400 120 C430 80 510 95 515 150 C560 145 590 185 565 215 C580 230 565 245 540 245 L270 245 C255 245 245 238 250 230 Z" opacity="0.95"/>
  </g>
  <text x="400" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#1a237e">MyMiniCloud</text>
  <g>
    <circle cx="110" cy="230" r="18" fill="url(#node)"/>
    <circle cx="150" cy="340" r="20" fill="url(#node2)"/>
    <circle cx="270" cy="380" r="18" fill="url(#node)"/>
    <circle cx="400" cy="395" r="22" fill="url(#node2)"/>
    <circle cx="530" cy="380" r="18" fill="url(#node)"/>
    <circle cx="650" cy="340" r="20" fill="url(#node2)"/>
    <circle cx="690" cy="230" r="18" fill="url(#node)"/>
  </g>
  <g fill="#0d1b3e" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <text x="110" y="234">WEB</text><text x="150" y="344">API</text><text x="270" y="384">DB</text>
    <text x="400" y="399">LB</text><text x="530" y="384">S3</text><text x="650" y="344">DNS</text>
    <text x="690" y="234">MON</text>
  </g>
  <g fill="#4fc3f7" opacity="0.9">
    <circle cx="255" cy="290" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="525" cy="285" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="320" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
